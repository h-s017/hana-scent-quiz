<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>課前問卷｜HANA SCENT ARTIST</title>
  <style>
    :root{
      --bg:#f7f7f5;
      --paper:#ffffff;
      --ink:#171717;
      --soft-ink:#55524e;
      --muted:#8b8782;
      --line:#e3e0dc;
      --line-dark:#c8c2bb;
      --accent:#6d716a;
      --accent-soft:#f0f2ee;
      --shadow:0 18px 45px rgba(20,20,20,.07);
      --radius-lg:28px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;
      background:radial-gradient(circle at 15% 0%, rgba(218,222,214,.65), transparent 34%), linear-gradient(180deg,#fbfbfa 0%,#f2f2ef 100%);
      color:var(--ink);
      line-height:1.75;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-1;
      background-image:linear-gradient(rgba(0,0,0,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.014) 1px, transparent 1px);
      background-size:46px 46px;
      opacity:.55;
    }
    .shell{width:min(920px,92vw);margin:34px auto 72px}
    .brand-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;color:var(--soft-ink);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    .brand-mark{font-weight:700;color:var(--ink)}
    .hero,.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
    .hero{padding:42px;position:relative;overflow:hidden}
    .hero::after{content:"";position:absolute;width:280px;height:280px;right:-120px;top:-130px;border:1px solid rgba(109,113,106,.22);border-radius:50%}
    .eyebrow{color:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-size:12px;margin-bottom:12px}
    h1{margin:0;font-size:clamp(32px,5vw,54px);line-height:1.18;font-weight:500;letter-spacing:.05em}
    .hero-subtitle{margin:18px 0 0;width:min(720px,100%);color:var(--soft-ink);font-size:16px}
    .hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
    .pill{border:1px solid var(--line-dark);background:rgba(255,255,255,.7);border-radius:999px;padding:7px 12px;font-size:12px}
    .card{padding:30px;margin-top:22px}
    .section-title{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
    h2{margin:0;font-size:22px;font-weight:520;letter-spacing:.04em}
    .section-note{margin:4px 0 0;color:var(--muted);font-size:13px}
    .progress{min-width:98px;text-align:right;color:var(--accent);font-size:13px}
    .field{margin-bottom:22px}
    .label{display:block;font-weight:600;margin-bottom:9px;letter-spacing:.02em}
    .hint{margin:-4px 0 10px;color:var(--muted);font-size:13px}
    input[type="text"],textarea{
      width:100%;
      border:1px solid var(--line-dark);
      border-radius:14px;
      padding:13px 14px;
      background:#fff;
      color:var(--ink);
      font-size:16px;
      outline:none;
    }
    textarea{min-height:104px;resize:vertical}
    input[type="text"]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(109,113,106,.12)}
    .option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .option{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:.16s ease;color:#2c2b29}
    .option:hover{border-color:var(--line-dark);background:#fafafa;transform:translateY(-1px)}
    .option input{margin-top:6px;accent-color:var(--accent)}
    .consent{background:#fbfaf8;border:1px solid var(--line);border-radius:16px;padding:15px;color:var(--soft-ink);font-size:14px}
    .consent label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
    .consent input{margin-top:7px;accent-color:var(--accent)}
    .required{color:#9b4d4d}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
    button{border:0;border-radius:999px;padding:14px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:.18s ease}
    .btn-primary{background:var(--ink);color:#fff}
    .btn-primary:hover{transform:translateY(-1px);background:#2c2c2b}
    .btn-secondary{background:var(--accent-soft);color:#363a34}
    .btn-line{background:#fff;color:#333;border:1px solid var(--line-dark)}
    .result{display:none}.result.show{display:block}
    .summary-box{white-space:pre-wrap;background:#fbfaf8;border:1px dashed #bbb4ad;border-radius:16px;padding:17px;color:#353330;font-size:14px;max-height:360px;overflow:auto}
    .notice{border-left:3px solid var(--accent);padding:12px 14px;background:#f7f8f5;color:var(--soft-ink);border-radius:10px;margin-top:14px;font-size:13px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:#1f1f1d;color:#fff;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s ease;z-index:20;font-size:14px}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:720px){
      .shell{width:min(100% - 28px,920px);margin:18px auto 54px}
      .brand-bar{font-size:10px;gap:8px;display:block}
      .hero{padding:30px 22px;border-radius:24px}
      .card{padding:21px;border-radius:24px}
      .section-title{display:block}.progress{text-align:left;margin-top:6px}
      .option-grid{grid-template-columns:1fr}
      .option{padding:14px 13px;min-height:52px}
      .actions{display:grid;grid-template-columns:1fr}button{width:100%;padding:15px 18px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand-bar">
      <div class="brand-mark">HANA SCENT ARTIST｜H.FUGUE ATELIER</div>
      <div>Course Intake Form</div>
    </div>

    <section class="hero">
      <div class="eyebrow">Course Intake</div>
      <h1>課前問卷</h1>
      <p class="hero-subtitle">調香經驗、香氣偏好與學習目標，作為課堂解析、學習紀錄與後續課程建議使用。</p>
      <div class="hero-meta">
        <span class="pill">課前問卷</span>
        <span class="pill">香氣偏好</span>
        <span class="pill">學習目標</span>
      </div>
    </section>

    <form id="intakeForm">
      <section class="card">
        <div class="section-title">
          <div>
            <h2>課程資料收集</h2>
            <p class="section-note">請依目前狀況填寫，沒有標準答案。</p>
          </div>
          <div class="progress">Form</div>
        </div>

        <div class="field">
          <label class="label" for="studentName">1. 名字 <span class="required">*</span></label>
          <input id="studentName" type="text" placeholder="喜歡別人怎麼稱呼你" required />
        </div>

        <div class="field">
          <label class="label">2. 性別</label>
          <div class="option-grid">
            <label class="option"><input type="radio" name="gender" value="女" />女</label>
            <label class="option"><input type="radio" name="gender" value="男" />男</label>
            <label class="option"><input type="radio" name="gender" value="不透露" />不透露</label>
            <label class="option"><input type="radio" name="gender" value="其他" />其他</label>
          </div>
        </div>

        <div class="field">
          <label class="label">3. 目前上過哪些調香課？</label>
          <p class="hint">可複選。</p>
          <div class="option-grid">
            <label class="option"><input type="checkbox" name="courses" value="沒有上過，第一次接觸" />沒有上過，第一次接觸</label>
            <label class="option"><input type="checkbox" name="courses" value="香水體驗課" />香水體驗課</label>
            <label class="option"><input type="checkbox" name="courses" value="蠟燭／擴香／香氛噴霧課" />蠟燭／擴香／香氛噴霧課</label>
            <label class="option"><input type="checkbox" name="courses" value="調香師證書課程" />調香師證書課程</label>
            <label class="option"><input type="checkbox" name="courses" value="天然精油／芳療課程" />天然精油／芳療課程</label>
            <label class="option"><input type="checkbox" name="courses" value="品牌香氛／商業調香課程" />品牌香氛／商業調香課程</label>
          </div>
          <div style="margin-top:10px;">
            <input id="coursesOther" type="text" placeholder="其他課程，可自行填寫" />
          </div>
        </div>

        <div class="field">
          <label class="label">4. 今天來上課的目的</label>
          <p class="hint">可複選。</p>
          <div class="option-grid">
            <label class="option"><input type="checkbox" name="purpose" value="興趣學習" />興趣學習</label>
            <label class="option"><input type="checkbox" name="purpose" value="想增加技能" />想增加技能</label>
            <label class="option"><input type="checkbox" name="purpose" value="未來想創業" />未來想創業</label>
            <label class="option"><input type="checkbox" name="purpose" value="已經有品牌來進修" />已經有品牌來進修</label>
          </div>
        </div>

        <div class="field">
          <label class="label" for="favoritePerfume">5. 你喜歡的香水名稱或品牌</label>
          <input id="favoritePerfume" type="text" placeholder="例如：Chanel Chance、Jo Malone 鼠尾草與海鹽、Le Labo Another 13，也可以填沒有特別喜歡的" />
        </div>

        <div class="field">
          <label class="label">6. 目前偏好的香調類型</label>
          <p class="hint">可複選。</p>
          <div class="option-grid">
            <label class="option"><input type="checkbox" name="preferredFamily" value="柑橘／清新" />柑橘／清新</label>
            <label class="option"><input type="checkbox" name="preferredFamily" value="花香" />花香</label>
            <label class="option"><input type="checkbox" name="preferredFamily" value="果香" />果香</label>
            <label class="option"><input type="checkbox" name="preferredFamily" value="木質" />木質</label>
            <label class="option"><input type="checkbox" name="preferredFamily" value="茶感／綠意" />茶感／綠意</label>
            <label class="option"><input type="checkbox" name="preferredFamily" value="琥珀／東方" />琥珀／東方</label>
            <label class="option"><input type="checkbox" name="preferredFamily" value="美食／甜感" />美食／甜感</label>
            <label class="option"><input type="checkbox" name="preferredFamily" value="西普／馥奇／苔蘚" />西普／馥奇／苔蘚</label>
          </div>
        </div>

        <div class="field">
          <label class="label" for="studyMore">7. 還有什麼想要進修？</label>
          <textarea id="studyMore" placeholder="例如：香水調香、品牌香氛設計、證照課程、創業、法規安全、配方修正等"></textarea>
        </div>

        <div class="field consent">
          <label>
            <input id="consent" type="checkbox" required />
            <span>填寫本表單即同意 Hana老師將資料用於課程解析、學習紀錄與後續課程建議，不會公開個人資料。</span>
          </label>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">送出課程資料</button>
          <button type="button" class="btn-secondary" id="resetBtn">重新填寫</button>
        </div>
      </section>
    </form>

    <section class="card result" id="resultSection">
      <div class="section-title">
        <div>
          <h2>資料摘要</h2>
          <p class="section-note">可直接複製給老師作為課堂紀錄。</p>
        </div>
        <div class="progress">Done</div>
      </div>
      <div class="summary-box" id="summaryBox"></div>
      <div class="actions">
        <button type="button" class="btn-primary" id="copyBtn">複製摘要</button>
        <button type="button" class="btn-line" id="printBtn">列印</button>
      </div>
      <div class="notice" id="submitNotice">資料送出中。</div>
    </section>
  </main>

  <div class="toast" id="toast">已完成</div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZ-i9zat_U57yJmHkTnEhIYsxNU3l5UMpmHCLkivz06PVtrccQhfS6SzTwnoewTO5t/exec";
    const $ = selector => document.querySelector(selector);
    const $$ = selector => [...document.querySelectorAll(selector)];

    function toast(message){
      const el = $("#toast");
      el.textContent = message;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1800);
    }

    function valuesByName(name){
      return $$("input[name='" + name + "']:checked").map(el => el.value);
    }

    function selectedValue(name){
      const el = $("input[name='" + name + "']:checked");
      return el ? el.value : "";
    }

    function buildSummary(payload){
      return `【課程資料收集】
姓名：${payload.name}
性別：${payload.gender || "未填寫"}
上過課程：${payload.courses.length ? payload.courses.join("、") : "未填寫"}
來上課的目的：${payload.purpose.length ? payload.purpose.join("、") : "未填寫"}
喜歡的香水名稱或品牌：${payload.favoritePerfume || "未填寫"}
目前偏好的香調：${payload.preferredFamily.length ? payload.preferredFamily.join("、") : "未填寫"}
還想進修：${payload.studyMore || "未填寫"}

資料使用同意：${payload.consentText}`;
    }

    async function sendToGoogleSheet(payload){
      if(!GOOGLE_SCRIPT_URL) return {ok:false, skipped:true};
      await fetch(GOOGLE_SCRIPT_URL, {
        method:"POST",
        mode:"no-cors",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
      return {ok:true};
    }

    $("#intakeForm").addEventListener("submit", async event => {
      event.preventDefault();
      const name = $("#studentName").value.trim();
      if(!name){ toast("請先填寫名字"); return; }
      if(!$("#consent").checked){ toast("請勾選資料使用同意"); return; }

      const courses = valuesByName("courses");
      const coursesOther = $("#coursesOther").value.trim();
      if(coursesOther) courses.push(coursesOther);

      const payload = {
        submittedAt:new Date().toISOString(),
        formType:"course_intake_only",
        name,
        gender:selectedValue("gender"),
        courses,
        purpose:valuesByName("purpose"),
        favoritePerfume:$("#favoritePerfume").value.trim(),
        preferredFamily:valuesByName("preferredFamily"),
        studyMore:$("#studyMore").value.trim(),
        answers:[],
        answerLog:[],
        scores:{A:0,B:0,C:0,D:0,E:0,F:0,G:0},
        profile:{
          type:"未進行人格測驗",
          english:"Course Intake Only",
          short:"資料收集",
          tags:[],
          desc:"本頁已移除香氣人格測驗，僅保留課程資料收集。",
          families:"",
          materials:"",
          formula:"",
          advice:""
        },
        consentText:"填寫本表單即同意 Hana老師將資料用於課程解析、學習紀錄與後續課程建議，不會公開個人資料。"
      };

      $("#summaryBox").textContent = buildSummary(payload);
      $("#resultSection").classList.add("show");
      $("#resultSection").scrollIntoView({behavior:"smooth", block:"start"});

      try{
        await sendToGoogleSheet(payload);
        $("#submitNotice").textContent = "資料已送出。若 Google Sheet 欄位設定正確，稍後可在表格中查看。";
      }catch(error){
        $("#submitNotice").textContent = "摘要已產生，但送出 Google Sheet 時發生錯誤。請檢查 Apps Script URL 與權限設定。";
      }
    });

    $("#copyBtn").addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText($("#summaryBox").textContent);
        toast("摘要已複製");
      }catch(error){
        toast("請手動選取複製");
      }
    });

    $("#printBtn").addEventListener("click", () => window.print());

    $("#resetBtn").addEventListener("click", () => {
      $("#intakeForm").reset();
      $("#resultSection").classList.remove("show");
      window.scrollTo({top:0, behavior:"smooth"});
    });
  </script>
</body>
</html>
